<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <title>You are offline - QuickQueue</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #212529;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { color: #6c757d; margin: 0 0 20px; }
    button { background: #0d6efd; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/pwa/icon-192.png" alt="QuickQueue">
    <h1>You are offline</h1>
    <p>Please check your internet connection. Your bookings are safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
