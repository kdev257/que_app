{% extends "base.html" %}

{% block content %}
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-primary">Your Tokens</h2>
            <p class="text-muted mb-0">Manage your active and past service requests</p>
        </div>
        <a href="{% url 'customer_dashboard' %}" class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="bi bi-plus-lg me-2"></i>New Request
        </a>
    </div>

    {% include "queues/partials/customer_tokens_list.html" %}
</div>

<style>
    /* Custom Styling for the "Attractive" look */
    .table thead th { border: none; }
    .table tbody td { border-color: #f8f9fa; padding-top: 1rem; padding-bottom: 1rem; }
    .btn-white { background: #fff; border: 1px solid #eee; }
    .btn-white:hover { background: #f8f9fa; }
    .card { transition: transform 0.2s; }
</style>
{% endblock %}
