{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}
<h2>Forgot Password?</h2>
<p>Enter your email address below, and we'll email instructions for setting a new one.</p>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit">Send Reset Email</button>
</form>
{% endblock %}
